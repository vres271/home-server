<div class="layout-wrapper">
  <!-- Боковое меню (десктоп) -->
  <aside class="layout-sidebar desktop-only">
    <div class="logo">
      <span>Hub</span>
    </div>
    
    <ul class="layout-menu">
      <li *ngFor="let item of menuItems">
        <a [routerLink]="item.routerLink" 
           routerLinkActive="active-menu-item">
          <i [class]="item.icon"></i>
          <span>{{ item.label }}</span>
        </a>
      </li>
    </ul>
  </aside>

  <!-- Боковое меню (мобильное) -->
  <p-sidebar 
    [visible]="isMobileMenuOpen"
    (visibleChange)="onSidebarVisibleChange($event)"
    position="left" 
    styleClass="mobile-sidebar">
    <ng-template pTemplate="header">
      <div class="logo">
        <span>Hub</span>
      </div>
    </ng-template>
    
    <ul class="layout-menu">
      <li *ngFor="let item of menuItems">
        <a [routerLink]="item.routerLink" 
           routerLinkActive="active-menu-item"
           (click)="closeMobileMenu()">
          <i [class]="item.icon"></i>
          <span>{{ item.label }}</span>
        </a>
      </li>
    </ul>
  </p-sidebar>

  <!-- Основной контент -->
  <main class="layout-main">
    <!-- Верхняя панель -->
    <p-toolbar styleClass="mb-2 md:mb-3">
      <div class="p-toolbar-group-start align-items-center">
        <button pButton icon="pi pi-bars" class="p-button-text p-button-rounded mobile-menu-btn" (click)="toggleMobileMenu()"></button>
        <img src="favicon.svg" alt="OrangePi Hub" class="logo-img"/>
        <span class="font-bold text-xl ml-2">OrangePi Home Server</span>
      </div>
      <div class="p-toolbar-group-end">
        <span class="text-sm text-500 hidden md:inline">v1.0</span>
      </div>
    </p-toolbar>

    <!-- Контент разделов -->
    <div class="content-container">
      <router-outlet></router-outlet>
    </div>
  </main>
</div>
