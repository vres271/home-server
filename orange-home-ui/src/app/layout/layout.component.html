<div class="layout-wrapper">
  <!-- Боковое меню (десктоп) -->
  <aside class="layout-sidebar desktop-only">
    <div class="logo">
      <span>Hub</span>
    </div>

    <!-- ✅ Общий враппер растягивается на всю высоту -->
    <div class="menu-wrapper">
      <ul class="layout-menu">
        <li *ngFor="let item of menuItems">
          <a [routerLink]="item.routerLink" routerLinkActive="active-menu-item">
            <i [class]="item.icon"></i>
            <span>{{ item.label }}</span>
          </a>
        </li>
      </ul>

      <!-- ✅ Прижимается к низу через margin-top: auto -->
      <ul class="layout-menu layout-menu-bottom">
        <li>
          <a (click)="toggleTheme()" role="button" class="theme-toggle">
            <i [class]="themeIcon()"></i>
            <span>{{ themeLabel() }}</span>
          </a>
        </li>
      </ul>
    </div>
  </aside>

  <!-- Боковое меню (мобильное) -->
  <p-sidebar
    [visible]="isMobileMenuOpen"
    (visibleChange)="onSidebarVisibleChange($event)"
    position="left"
    styleClass="mobile-sidebar">
    <ng-template pTemplate="header">
      <div class="logo">
        <span>Hub</span>
      </div>
    </ng-template>

    <div class="menu-wrapper">
      <ul class="layout-menu">
        <li *ngFor="let item of menuItems">
          <a [routerLink]="item.routerLink"
             routerLinkActive="active-menu-item"
             (click)="closeMobileMenu()">
            <i [class]="item.icon"></i>
            <span>{{ item.label }}</span>
          </a>
        </li>
      </ul>

      <ul class="layout-menu layout-menu-bottom">
        <li>
          <a (click)="toggleTheme()" role="button" class="theme-toggle">
            <i [class]="themeIcon()"></i>
            <span>{{ themeLabel() }}</span>
          </a>
        </li>
      </ul>
    </div>
  </p-sidebar>

  <!-- Основной контент -->
  <main class="layout-main">
    <p-toolbar styleClass="mb-2 md:mb-3">
      <div class="p-toolbar-group-start align-items-center">
        <button pButton icon="pi pi-bars" class="p-button-text p-button-rounded mobile-menu-btn" (click)="toggleMobileMenu()"></button>
        <img src="favicon.svg" alt="OrangePi Hub" class="logo-img"/>
        <span class="font-bold text-xl ml-2">OrangePi Home Server</span>
      </div>
      <div class="p-toolbar-group-end">
        <span class="text-sm text-500 hidden md:inline">v1.0</span>
      </div>
    </p-toolbar>

    <div class="content-container">
      <router-outlet></router-outlet>
    </div>
  </main>
</div>
