<p-toast></p-toast>

<div class="flex flex-column md:flex-row gap-3 mb-4 mt-3">
  <input 
    pInputText 
    type="text" 
    [(ngModel)]="searchQuery" 
    placeholder="Название фильма, сериала или раздачи..." 
    class="w-full md:flex-1"
    (keydown.enter)="search()"
  />
  <p-button 
    label="Поиск" 
    icon="pi pi-search" 
    styleClass="w-full md:w-auto"
    (onClick)="search()" 
    [loading]="searchLoading">
  </p-button>
</div>

<div *ngIf="searchLoading" class="text-center p-4">
  <i class="pi pi-spin pi-spinner" style="font-size: 2rem"></i>
  <p class="mt-2">Выполняется поиск...</p>
</div>

<div *ngIf="!searchLoading && results.length === 0 && searchQuery" class="text-center p-4 text-500">
  Ничего не найдено.
</div>

<div *ngFor="let result of results" class="torrent-card mb-2 md:mb-3 p-2 md:p-3 border-1 surface-border border-round">
  <div class="font-bold mb-1">{{ result.Title }}</div>
  <small class="text-500 block mb-2">
    {{ getCategory(result.Title) === 'series' ? '📺 Сериал' : '🎬 Фильм' }} • {{ result.Tracker }}
  </small>
  
  <div class="flex flex-wrap gap-3 mb-2 text-sm">
    <span>{{ formatSize(result.Size) }}</span>
    <span>
      <span class="text-green-600 font-bold">{{ result.Seeders }}</span> сидов / 
      <span class="text-red-500">{{ result.Peers }}</span> пиров
    </span>
  </div>
  
  <div class="flex justify-content-end">
    <p-button 
      label="Добавить"
      icon="pi pi-download" 
      severity="success" 
      size="small" 
      (onClick)="addTorrent(result)">
    </p-button>
  </div>
</div>
