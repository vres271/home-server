<p-toast position="bottom-right"></p-toast>

<!-- ═══════════════════════════════════════════════════════════════ -->
<!-- РЕЖИМ 1: ПОИСК В TMDB (список фильмов) -->
<!-- ═══════════════════════════════════════════════════════════════ -->
@if (viewState === 'search') {
  <app-tmdb-search 
    [savedResults]="savedTmdbResults"
    [savedQuery]="savedTmdbQuery"
    [savedHasSearched]="savedTmdbHasSearched"
    (mediaSelected)="onMediaSelected($event)"
    (searchCompleted)="onTmdbSearchCompleted($event)"
    (requestDirectSearch)="onRequestDirectSearch()">
  </app-tmdb-search>

  <!-- Разделитель и заголовок для прямого поиска -->
  @if (showDirectSearch) {
    <div class="my-4 border-top-1 surface-border pt-4">
      <div class="flex align-items-center justify-content-between mb-3">
        <h3 class="text-xl font-bold m-0">Прямой поиск раздач</h3>
        <p-button 
          icon="pi pi-times" 
          severity="secondary" 
          text="true" 
          rounded="true" 
          size="small"
          (onClick)="closeDirectSearch()"
          title="Закрыть прямой поиск">
        </p-button>
      </div>
    </div>

    <!-- Поле прямого поиска -->
    <div #directSearchBlock class="flex flex-column md:flex-row gap-3 mb-4 mt-3">
      <p-iconField iconPosition="right" class="w-full md:flex-1">
        <input 
          pInputText 
          type="text" 
          [ngModel]="searchQuery"
          (ngModelChange)="onSearchQueryChange($event)"
          placeholder="Название раздачи, трекер, качество..." 
          class="w-full"
          (keydown.enter)="search()"
        />
        @if (searchQuery) {
          <p-inputIcon styleClass="cursor-pointer" (click)="clearDirectSearch()">
            <i class="pi pi-times"></i>
          </p-inputIcon>
        }
      </p-iconField>
      
      <p-button 
        label="Поиск" 
        icon="pi pi-search" 
        severity="warn"
        styleClass="w-full md:w-auto"
        (onClick)="search()" 
        [loading]="searchLoading">
      </p-button>
    </div>

    <!-- Результаты прямого поиска -->
    <app-torrent-results
      [results]="results"
      [loading]="searchLoading"
      [overlayMode]="true"
      [hasSearched]="!!searchQuery"
      (addTorrent)="addTorrent($event)">
    </app-torrent-results>
  }
}

<!-- ═══════════════════════════════════════════════════════════════ -->
<!-- РЕЖИМ 2: ДЕТАЛИ ФИЛЬМА + РЕЗУЛЬТАТЫ JACKETT -->
<!-- ═══════════════════════════════════════════════════════════════ -->
@if (viewState === 'details' && selectedMedia) {
  
  <app-media-details 
    [media]="selectedMedia"
    [fullDetails]="fullMediaDetails"
    [isLoadingDetails]="isLoadingDetails"
    (goBack)="onGoBack()">
  </app-media-details>

  <div>
    <h3 class="text-2xl font-bold mb-4 flex align-items-center gap-2">
      <i class="pi pi-download text-primary"></i>
      Доступные раздачи
    </h3>

    <!-- Индикатор загрузки торрентов (полноэкранный спиннер) -->
    @if (searchLoading && results.length === 0) {
      <div class="flex justify-content-center align-items-center py-6">
        <i class="pi pi-spin pi-spinner text-3xl text-primary mr-3"></i>
        <span class="text-500">Ищем лучшие раздачи...</span>
      </div>
    }

    <!-- Список найденных торрентов или пустое состояние -->
    <app-torrent-results
      [results]="results"
      [loading]="searchLoading"
      [overlayMode]="false"
      [showEmptyState]="true"
      [hasSearched]="true"
      (addTorrent)="addTorrent($event)"
      (requestDirectSearch)="onRequestDirectSearch()">
    </app-torrent-results>
  </div>
}
