<p-toast position="bottom-right"></p-toast>

<div class="flex justify-content-end mb-2" style="margin-top: -44px;">
  <div class="flex align-items-center gap-3">
    
    <span class="text-sm inline-flex align-items-center gap-1">
      <span class="text-500">{{ formatSize(freeSpace) }}</span>
    </span>
    
    <p-button 
      icon="pi pi-refresh" 
      severity="secondary" 
      size="small" 
      (onClick)="loadTorrents()" 
      [loading]="downloadsLoading">
    </p-button>
    
  </div>
</div>

<div *ngIf="downloadsLoading" class="text-center p-4">
  <i class="pi pi-spin pi-spinner" style="font-size: 2rem"></i>
  <p class="mt-2">Загрузка списка...</p>
</div>

<div *ngIf="!downloadsLoading && activeTorrents.length === 0" class="text-center p-4 text-500">
  Нет активных загрузок.
</div>

<div *ngFor="let torrent of activeTorrents" class="torrent-card mb-2 md:mb-3 p-2 md:p-3 border-1 surface-border border-round">
  <div class="font-bold mb-1">{{ torrent.name }}</div>
  
  <div class="flex justify-content-between align-items-center mb-2 text-sm text-500">
    <!-- Левая часть: Размер и категория -->
    <span>{{ formatSize(torrent.size) }} • {{ torrent.category || 'Без категории' }}</span>
    
    <!-- Правая часть: ETA (только если загрузка не завершена) -->
    <span *ngIf="torrent.progress < 1" class="inline-flex align-items-center gap-1">
      <i class="pi pi-clock" style="font-size: 0.875rem; vertical-align: middle;"></i>
      {{ formatEta(torrent.eta) }}
    </span>
    
    <!-- Правая часть: Если загрузка завершена -->
    <span *ngIf="torrent.progress === 1" title="Завершено" class="text-green-600 inline-flex align-items-center gap-1 font-medium">
      <i class="pi pi-check-circle" style="font-size: 0.875rem; vertical-align: middle;"></i>
    </span>
  </div>
  
  <p-progressBar [value]="formatSpeedProgress(torrent.progress)" [showValue]="true" styleClass="torrent-progress-bar"></p-progressBar>
    
  <div class="flex justify-content-between align-items-center gap-2">
    <div class="flex align-items-center gap-2">
      <span class="text-sm">{{ getStateLabel(torrent.state) }}</span>
      <span *ngIf="torrent.state === 'downloading'" class="text-sm text-green-800">
        {{ formatSpeed(torrent.dlspeed) }}
      </span>
      <span *ngIf="torrent.state === 'uploading'" class="text-sm text-blue-400">
        {{ formatSpeed(torrent.upspeed) }}
      </span>
    </div>
    <div class="flex gap-2">
      <p-button 
        *ngIf="['downloading', 'forcedDL', 'metaDL', 'stalledDL', 'uploading', 'forcedUP', 'stalledUP'].includes(torrent.state)"
        icon="pi pi-pause" 
        severity="warn" 
        [size]="'small'" 
        (onClick)="pauseTorrent(torrent.hash)"
        pTooltip="Пауза">
      </p-button>
      
      <p-button 
        *ngIf="['stoppedDL', 'stoppedUP'].includes(torrent.state)"
        icon="pi pi-play" 
        [severity]="'success'" 
        [size]="'small'" 
        (onClick)="resumeTorrent(torrent.hash)"
        pTooltip="Возобновить">
      </p-button>
      
      <p-button 
        icon="pi pi-trash" 
        [severity]="'danger'" 
        [size]="'small'" 
        (onClick)="deleteTorrent(torrent.hash, torrent.name)"
        pTooltip="Удалить торрент и файлы">
      </p-button>
    </div>
  </div>
</div>
